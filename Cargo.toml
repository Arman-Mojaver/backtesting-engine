[package]
name = "backtesting-engine"
version = "0.1.0"
edition = "2021"
autobins = false
autobenches = false

[lib]
doctest = false

[[bin]]
name = "bte"
path = "src/bin/bt-engine.rs"

[profile.dev]
# Use `debug = "line-tables-only"` if you need backtraces.
debug = false

[dependencies]
clap = { version = "4.5", features = ["string", "derive"] }
cached = "4"
anyhow = "1.0"
postgres = "0.19"
arrow = "60"
parquet = { version = "60", features = ["arrow"] }
rustc-hash = "2.1.2"
rayon = "1.12"
log = "0.4"
simplelog = "0.12"
itertools = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# float thresholds/comparisons, PG adapter i32->i64 reads, timestamp arithmetic.
float_cmp = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
# Internal crate (not published) -- doc-completeness lints deferred.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# Low signal-to-noise for this codebase.
must_use_candidate = "allow"
similar_names = "allow"
implicit_hasher = "allow"
# Divisive style lints -- plain if/else and let-bindings preferred over
# match-with-wildcard and let-else; not worth the churn here.
single_match_else = "allow"
manual_let_else = "allow"
todo = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
panic_in_result_fn = "deny"
exit = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
string_slice = "deny"
use_self = "deny"
derive_partial_eq_without_eq = "deny"
missing_const_for_fn = "deny"
suboptimal_flops = "deny"
option_if_let_else = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
nursery = { level = "deny", priority = -1 }
