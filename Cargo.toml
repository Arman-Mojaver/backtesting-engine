[package]
name = "backtesting-engine"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autobenches = false

[lib]
doctest = false

[[bin]]
name = "bte"
path = "src/bin/bte.rs"

[profile.dev]
# Use `debug = "line-tables-only"` if you need backtraces.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# No unwinding: clippy denies panics in this crate, and a panicking rayon task
# kills the batch run either way — abort drops the unwind tables for free.
panic = "abort"

[package.metadata.cargo-machete]
# False positive: only referenced via the `format_description!` macro expansion.
ignored = ["time"]

[dependencies]
clap = "4.5"
# Only the `#[cached]` macro over the default `UnboundCache`; no timed stores.
cached = { version = "4", default-features = false, features = ["proc_macro"] }
anyhow = "1.0"
# Typed domain errors: derives Display + std::error::Error for error enums.
thiserror = "2"
postgres = "0.19"
# Feature-trimmed: only ZSTD parquet and core Arrow types are used — the other
# codec backends (snap/brotli/flate2/lz4) and arrow's csv/ipc/json features
# compile out, shrinking the dep graph, the binary, and build times.
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "base64"] }
rustc-hash = "2.1.2"
rayon = "1.12"
log = "0.4"
simplelog = "0.12"
# Needed directly: simplelog's `format_description!` expands to `::time::` paths.
time = { version = "0.3", features = ["formatting", "macros"] }
itertools = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Global allocator, see src/bin/bte.rs
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3"
# No in-tree benches (autobenches = false; benches/ is intentionally empty):
# criterion powers ad-hoc /bench measurement sessions, which create
# temporary bench targets. Removing it breaks /bench; keeping it costs
# dev-only compile time.
criterion = { version = "0.8", features = ["html_reports"] }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# float thresholds/comparisons, PG adapter i32->i64 reads, timestamp arithmetic.
float_cmp = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
# Internal crate (not published) -- doc-completeness lints deferred.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# Low signal-to-noise for this codebase.
must_use_candidate = "allow"
similar_names = "allow"
implicit_hasher = "allow"
todo = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
panic_in_result_fn = "deny"
exit = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
string_slice = "deny"
use_self = "deny"
derive_partial_eq_without_eq = "deny"
missing_const_for_fn = "deny"
suboptimal_flops = "deny"
option_if_let_else = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
nursery = { level = "deny", priority = -1 }
