[package]
name = "backtesting-engine"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[[bin]]
name = "ct"
path = "src/main.rs"

[[bin]]
name = "bt-engine"
path = "src/bin/bt-engine.rs"

[dependencies]
clap = { version = "4.5", features = ["string", "derive"] }
anyhow = "1.0"
postgres = "0.19"
redis = { version = "1.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
arrow = "58"
parquet = { version = "58", features = ["arrow"] }

[dev-dependencies]
tempfile = "3"
