[package]
name = "backtesting-engine"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[[bin]]
name = "ct"
path = "src/main.rs"

[[bin]]
name = "bt-engine"
path = "src/bin/bt-engine.rs"

[[bin]]
name = "webapp"
path = "src/bin/webapp.rs"

[dependencies]
clap = { version = "4.5", features = ["string", "derive"] }
cached = "2"
anyhow = "1.0"
postgres = "0.19"
arrow = "58"
parquet = { version = "58", features = ["arrow"] }
rustc-hash = "2.1.2"
rayon = "1.12"
log = "0.4"
simplelog = "0.12"
time = { version = "=0.3.41", features = ["formatting"] }
axum = "0.8"
tokio = { version = "1.53.1", features = ["full"] }
askama = "0.16"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
sysinfo = "0.38"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
