[package]
name = "backtesting-engine"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[[bin]]
name = "ct"
path = "src/main.rs"

[[bin]]
name = "bt-engine"
path = "src/bin/bt-engine.rs"

[dependencies]
clap = { version = "4.5", features = ["string", "derive"] }
cached = "2"
anyhow = "1.0"
postgres = "0.19"
arrow = "58"
parquet = { version = "58", features = ["arrow"] }
rustc-hash = "2.1.2"
rayon = "1.12"
log = "0.4"
simplelog = "0.12"
time = "=0.3.41"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# float thresholds/comparisons, PG adapter i32->i64 reads, timestamp arithmetic.
float_cmp = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
# Internal crate (not published) -- doc-completeness lints deferred.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# Low signal-to-noise for this codebase.
must_use_candidate = "allow"
similar_names = "allow"
implicit_hasher = "allow"
# Divisive style lints -- plain if/else and let-bindings preferred over
# match-with-wildcard and let-else; not worth the churn here.
single_match_else = "allow"
manual_let_else = "allow"

# --- Strict-lint adoption plan ---------------------------------------------
# Uncomment one phase at a time -> fix errors -> commit. Error counts are
# from the 1.94.0 baseline run (398 errors total across all phases).
#
# Phase 0 -- ACTIVE, zero errors (verified):
todo = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
panic_in_result_fn = "deny"
exit = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
string_slice = "deny"
#
# Phase 3 -- mechanical nursery cleanup:
# use_self = "deny"                      # 48 -- StructName:: -> Self:: (try cargo clippy --fix)
# derive_partial_eq_without_eq = "deny"  # 11 -- add Eq; check f64 fields first
# missing_const_for_fn = "deny"          # 7 -- add const
# suboptimal_flops = "deny"              # 1
# option_if_let_else = "deny"            # 1
#
# Phase 4 -- indicator math hardening:
# indexing + arithmetic fire on the SAME lines (points[start + k]) -- fix together.
# indexing_slicing = "deny"           # 51 -- .get() + error strategy
# arithmetic_side_effects = "deny"    # 77 (52 prod / 25 test; no test exemption)
#
# Phase 5 -- casts:
# as_conversions = "deny"             # 171 (41 prod / 130 test fixtures; no test exemption)
#
# Capstone -- uncomment AFTER phases 2-4: enables the whole nursery group.
# Should be clean by then; catches future nursery lints. (BETA LINTS)
# nursery = { level = "deny", priority = -1 }
