# CI pipeline DAG:
#
#   preflight ──┬──> lint ──┐
#               └──> test ──┴──> docker (build & push runtime + dev, linux/arm64)
#
#   deny (cargo-deny: advisories, licenses, bans, sources) runs independently.
#
# preflight gates the whole pipeline: if the Docker Hub login fails
# (invalid or revoked credentials), lint and test are skipped
# (fail fast, no wasted compute).
#
# Images are linux/arm64 ONLY: they run exclusively on Apple Silicon. The
# docker job builds natively on GitHub's arm64 runners — no QEMU, no
# cross-toolchain — so the Dockerfile's target-cpu tuning stays honest.
#
# Intentional: lint and test run only on pushes to main, behind the Docker
# Hub preflight. There is a single developer, so there are no pull requests
# to gate. Revisit when a second contributor joins.

name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (Docker Hub access check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  lint:
    name: Lint
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with clippy (warnings denied)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build docs (warnings denied)
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Install cargo-machete
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

  test:
    name: Test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --locked

  deny:
    name: Supply-chain checks (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  docker:
    name: Build and push Docker images (linux/arm64)
    needs: [lint, test]
    # Native arm64 runners (free for public repos; available in private repos
    # at 2 vCPU vs 4 vCPU public — hence the timeout headroom for cold builds).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Separate cache scopes so one step's mode=max export doesn't evict the
      # other's layers; each reads both, so the shared fetcher stage is reused.
      - name: Build and push runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          push: true
          tags: |
            armanmojaver/backtesting-engine:latest
            armanmojaver/backtesting-engine:${{ steps.vars.outputs.sha_short }}
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=runtime
          provenance: false

      - name: Build and push dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          platforms: linux/arm64
          push: true
          tags: armanmojaver/backtesting-engine:dev
          cache-from: |
            type=gha,scope=dev
            type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=dev
          provenance: false

      - name: Logout from Docker Hub
        run: docker logout

      - name: Write job summary
        run: |
          {
            echo "## Docker images published (linux/arm64)"
            echo ""
            echo '- `armanmojaver/backtesting-engine:latest`'
            echo '- `armanmojaver/backtesting-engine:${{ steps.vars.outputs.sha_short }}`'
            echo '- `armanmojaver/backtesting-engine:dev`'
          } >> "$GITHUB_STEP_SUMMARY"
