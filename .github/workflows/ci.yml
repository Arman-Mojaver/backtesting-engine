# CI pipeline DAG:
#
#   preflight ──┬──> lint ──┐
#               └──> test ──┴──> docker (build & push)
#
# preflight gates the whole pipeline: if the Docker Hub login fails
# (invalid or revoked credentials), lint and test are skipped
# (fail fast, no wasted compute).

name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (Docker Hub access check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  lint:
    name: Lint
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain (pinned to match Dockerfile)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with clippy (warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain (pinned to match Dockerfile)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  docker:
    name: Build and push Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            armanmojaver/backtesting-engine:latest
            armanmojaver/backtesting-engine:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Logout from Docker Hub
        run: docker logout

      - name: Write job summary
        run: |
          {
            echo "## Docker image published"
            echo ""
            echo '- `armanmojaver/backtesting-engine:latest`'
            echo '- `armanmojaver/backtesting-engine:${{ steps.vars.outputs.sha_short }}`'
          } >> "$GITHUB_STEP_SUMMARY"
