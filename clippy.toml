# Test-code exemptions for the deny-level panic/indexing lints configured in
# Cargo.toml [lints.clippy]. These are clippy.toml options, not Cargo lints.
# Phase 0 -- active and verified: zero panic-lint hits in test code.
# Verified against the pinned toolchain (1.94.0).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
