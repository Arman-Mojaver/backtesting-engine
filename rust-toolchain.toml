# Exact-pinned to match the Docker image (rust:1.98.1); CI installs from this
# file. rustup applies this automatically — bump both together.
# Excluded from the Docker build context (.dockerignore): the image pins its
# toolchain by tag, and its rustup shims would otherwise hit the network.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
