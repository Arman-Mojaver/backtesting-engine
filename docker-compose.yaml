services:
  engine:
    container_name: engine
    image: armanmojaver/backtesting-engine:dev
    platform: linux/arm64
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - RUST_LOG=${RUST_LOG}
    volumes:
      - ./src:/app/src
      - ./Cargo.toml:/app/Cargo.toml
      - ./Cargo.lock:/app/Cargo.lock
      - ${PARQUET_FILES_PATH}:/app/parquet_files
      - ./logs:/app/logs
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/app/target
    working_dir: /app
    command: ["sh", "-c", "touch logs/bt-engine.log && tail -F logs/bt-engine.log"]

volumes:
  cargo-registry:
  cargo-git:
  target:
