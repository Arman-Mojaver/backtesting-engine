services:
  engine:
    container_name: engine
    image: armanmojaver/backtesting-engine
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/app/target
    working_dir: /app
    command: cargo watch -i logs/ -x "build --bin bt-engine" -s "cp target/debug/bt-engine /usr/local/bin/bt-engine"

volumes:
  cargo-registry:
  cargo-git:
  target:
